name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 唤醒词（KWS）依赖 sherpa-onnx。默认会从源码编译那份 C++，而它的
      # cmake/show-info.cmake 里用 `wmic os get caption,version` 取系统信息——
      # GitHub 的 windows-latest 已经移除 WMIC，取到空字符串 → string(REPLACE)
      # 参数不足 → configure 失败（2026-11-15 v0.3.9 首次发版就是这么挂的）。
      # 本机一直是走官方预编译库（.cargo/config.toml 里的 SHERPA_LIB_PATH），
      # CI 也照做：拉预编译库 + 用 GITHUB_ENV 传路径，直接跳过 C++ 源码编译。
      - name: 准备 sherpa-onnx 预编译库（跳过 C++ 源码编译）
        shell: pwsh
        run: |
          ./scripts/fetch-sherpa.ps1
          $lib = Join-Path $env:USERPROFILE "petra-sherpa\prebuilt\sherpa-onnx-v1.12.9-win-x64-shared"
          if (-not (Test-Path $lib)) { throw "预编译库目录不存在：$lib" }
          "SHERPA_LIB_PATH=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "SHERPA_LIB_PATH=$lib"

      - name: Install frontend dependencies
        run: npm ci

      # 守门：包内公钥必须是新公钥、版本号必须与 tag 一致，否则直接失败
      # （公钥是编译进包里的，发错了那批用户之后永远收不到更新）
      - name: 发布前校验（公钥 + 版本号 + endpoint）
        shell: bash
        run: node scripts/check-release-guard.mjs

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Petra ${{ github.ref_name }}"
          releaseBody: |
            Petra ${{ github.ref_name }}

            下载 `Petra_*_x64-setup.exe`，解压后运行其中的 setup.exe 安装。
          releaseDraft: false
          prerelease: false
          # 注意：必须保持 prerelease=false，否则 GitHub releases/latest 不会指向本版本，
          # updater endpoint (releases/latest/download/latest.json) 将 404，客户端无法发现更新。
          # tauri-action 自动:构建 + 用 TAURI_SIGNING_PRIVATE_KEY 签名 updater artifacts
          # + 生成 latest.json(含 signature/url)作为 Release 附件
          includeUpdaterJson: true

      # 兼容性归一化：tauri-action 生成的 latest.json 中 windows-x86_64 默认指向 MSI，
      # 而 v0.1.5 legacy updater 固定读取该 key 并当作 .exe 启动。
      # 因此把 windows-x86_64 覆盖为 NSIS（与 windows-x86_64-nsis 一致），
      # 保留 windows-x86_64-msi。不硬编码版本/URL/signature，从 JSON 动态复制。
      - name: Normalize updater metadata (legacy compat)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          # 下载 tauri-action 生成的 latest.json
          gh release download "${{ github.ref_name }}" -p latest.json -R "${{ github.repository }}" -D /tmp/ --clobber
          # 归一化: windows-x86_64 → NSIS
          node scripts/normalize-updater-metadata.mjs /tmp/latest.json /tmp/latest-fixed.json
          # 以正确文件名重新生成（gh upload 按文件名命名 asset）
          cp /tmp/latest-fixed.json /tmp/latest.json
          # 删除旧的 latest.json asset
          ASSET_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq '.assets[] | select(.name=="latest.json") | .id')
          gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$ASSET_ID"
          # 上传归一化后的 latest.json（仅替换 metadata，不动 installer）
          gh release upload "${{ github.ref_name }}" /tmp/latest.json --clobber -R "${{ github.repository }}"
          echo "latest.json 已归一化并重新上传（windows-x86_64 → NSIS）"
